<!doctype html>
<html lang="zh-Hant" data-theme="frieren">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craig 的日常</title>
  <meta name="description" content="Craig 的個人日常網站：每日晨報、市場先生洞察、讀過的論文與筆記、青年補助與獎學金。">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
  <script>
    // 先套用上次選的主題，避免閃爍
    try { var t = localStorage.getItem("cd-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-art" aria-hidden="true"><div class="bg-img" id="bg-img"></div></div>
  <div class="sky" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="#top"><span class="brand-motif" data-motif></span>Craig 的日常</a>
        <nav class="nav" aria-label="主選單">
          <div class="nav-scroll">
            <a href="#brief">晨報</a>
            <a href="#market">市場洞察</a>
            <a href="#papers">論文</a>
            <a href="#notes">筆記</a>
            <a href="#funding">補助・獎學金</a>
          </div>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="hero wrap">
        <div class="hero-text">
          <p class="eyebrow" id="hero-date"></p>
          <h1 id="hero-title">今天也從一杯咖啡開始。</h1>
          <p class="lede" id="hero-tagline"></p>
          <div class="theme-picker">
            <p class="picker-label">切換今日主題</p>
            <div class="theme-chips" id="theme-chips" role="radiogroup" aria-label="動漫主題"></div>
          </div>
        </div>
        <figure class="kv" id="kv">
          <div class="kv-frame">
            <img id="kv-img" alt="" referrerpolicy="no-referrer" decoding="async">
            <span class="kv-fallback" data-motif aria-hidden="true"></span>
          </div>
          <figcaption id="kv-credit"></figcaption>
        </figure>
      </section>

      <section class="wrap stats" id="stats" aria-label="今日總覽"></section>

      <!-- 晨報 -->
      <section class="block wrap" id="brief">
        <div class="block-head">
          <div><p class="kicker">Morning Brief</p><h2>每日晨報</h2></div>
          <p class="block-sub" id="brief-meta"></p>
        </div>
        <article class="paper brief" id="brief-body"></article>
      </section>

      <!-- 市場先生 -->
      <section class="block wrap" id="market">
        <div class="block-head">
          <div><p class="kicker">Mr. Market</p><h2>市場先生洞察</h2></div>
          <p class="block-sub" id="market-meta"></p>
        </div>
        <div class="market-summary paper" id="market-summary"></div>
        <div class="grid cards-3" id="market-list"></div>
      </section>

      <!-- 論文 -->
      <section class="block wrap" id="papers">
        <div class="block-head">
          <div><p class="kicker">Papers</p><h2>讀過的論文</h2></div>
          <p class="block-sub" id="papers-meta"></p>
        </div>
        <div class="filters" id="papers-filters"></div>
        <div class="grid cards-2" id="papers-list"></div>
      </section>

      <!-- 筆記 -->
      <section class="block wrap" id="notes">
        <div class="block-head">
          <div><p class="kicker">Notes</p><h2>整理過的筆記</h2></div>
          <p class="block-sub" id="notes-meta"></p>
        </div>
        <div class="filters" id="notes-filters"></div>
        <div class="grid cards-3" id="notes-list"></div>
      </section>

      <!-- 補助・獎學金 -->
      <section class="block wrap" id="funding">
        <div class="block-head">
          <div><p class="kicker">Grants &amp; Scholarships</p><h2>青年補助・獎學金</h2></div>
          <p class="block-sub" id="funding-meta"></p>
        </div>
        <div class="filters" id="funding-filters"></div>
        <div class="grid cards-3" id="funding-list"></div>
        <h3 class="sub-head" id="opps-head">實驗室頻道看到的機會</h3>
        <div class="grid cards-3" id="opps-list"></div>
      </section>
    </main>

    <footer class="footer wrap">
      <p>Craig 的日常 · 2026</p>
      <p id="credits"></p>
    </footer>
  </div>

  <script src="data/themes.js?v=5"></script>
  <script src="data/brief.js?v=5"></script>
  <script src="data/market.js?v=5"></script>
  <script src="data/papers.js?v=5"></script>
  <script src="data/notes.js?v=5"></script>
  <script src="data/lab.js?v=5"></script>
  <script src="data/funding.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
