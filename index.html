<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craig 的日常</title>
  <meta name="description" content="Craig 的個人網站：每日晨報、每日市場洞察、碩士班讀過的論文與筆記、青年補助與獎學金。">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b161b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
  <div class="bg-art" aria-hidden="true"><div class="bg-img" id="bg-img"></div></div>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="grid-bg" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="#top"><span class="brand-motif" data-motif></span><span id="brand-name">Craig Shih</span></a>
        <nav class="nav" aria-label="主選單">
          <div class="nav-scroll">
            <a href="#stickies">便利貼</a>
            <a href="#brief">晨報</a>
            <a href="#market">市場洞察</a>
            <a href="#papers">論文</a>
            <a href="#notes">筆記</a>
            <a href="#funding">補助・獎學金</a>
          </div>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="hero wrap">
        <div class="hero-shapes" id="hero-shapes" aria-hidden="true"></div>
        <div class="hero-text">
          <p class="eyebrow" id="hero-date"></p>
          <h1 class="hero-name" id="hero-name">Craig Shih</h1>
          <p class="hero-role" id="hero-role"></p>
          <p class="hero-line" id="hero-line"></p>
          <div class="hero-cta">
            <a class="pill solid" href="#market">今日市場洞察 →</a>
            <a class="pill" href="#papers">我的論文書架</a>
          </div>
        </div>
        <figure class="kv" id="kv">
          <div class="kv-ring">
            <div class="kv-frame" id="kv-frame">
              <span class="kv-fallback" data-motif aria-hidden="true"></span>
            </div>
          </div>
          <figcaption>
            <div class="kv-meta"><span class="kv-badge" id="kv-badge"></span><span class="kv-dots" id="kv-dots"></span></div>
            <p class="kv-credit" id="kv-credit"></p>
          </figcaption>
        </figure>
      </section>

      <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
      <div class="gallery" aria-label="今日圖鑑"><div class="gallery-track" id="gallery"></div></div>

      <section class="wrap bento" id="bento" aria-label="今日總覽"></section>

      <section class="block wrap" id="stickies">
        <div class="block-head reveal">
          <span class="block-num" aria-hidden="true">01</span>
          <p class="kicker">Sticky Notes</p>
          <h2 class="grad">隨手便利貼</h2>
          <p class="block-sub" id="stickies-meta"></p>
        </div>
        <div class="filters" id="stickies-filters"></div>
        <div class="sticky-wall" id="stickies-list"></div>
        <div class="sticky-more" id="stickies-more"></div>
      </section>

      <section class="block wrap" id="brief">
        <div class="block-head reveal">
          <span class="block-num" aria-hidden="true">02</span>
          <p class="kicker">Morning Brief</p>
          <h2 class="grad">每日晨報</h2>
          <p class="block-sub" id="brief-meta"></p>
        </div>
        <article class="paper brief reveal" id="brief-body"></article>
      </section>

      <section class="block wrap" id="market">
        <div class="block-head reveal">
          <span class="block-num" aria-hidden="true">03</span>
          <p class="kicker">Daily Market Insight</p>
          <h2 class="grad">每日市場洞察</h2>
          <p class="block-sub" id="market-meta"></p>
        </div>
        <div class="market-summary paper reveal" id="market-summary"></div>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="瀏覽方式">
            <button data-mode="topic" class="on">依主題</button>
            <button data-mode="platform">依平台</button>
          </div>
        </div>
        <div class="tabs" id="market-tabs" role="tablist"></div>
        <div class="grid cards-3" id="market-list"></div>
      </section>

      <section class="block wrap" id="papers">
        <div class="block-head reveal">
          <span class="block-num" aria-hidden="true">04</span>
          <p class="kicker">Reading List</p>
          <h2 class="grad">讀過的論文</h2>
          <p class="block-sub" id="papers-meta"></p>
        </div>
        <div class="filters" id="papers-filters"></div>
        <div class="timeline" id="papers-list"></div>
      </section>

      <section class="block wrap" id="notes">
        <div class="block-head reveal">
          <span class="block-num" aria-hidden="true">05</span>
          <p class="kicker">Notes</p>
          <h2 class="grad">整理過的筆記</h2>
          <p class="block-sub" id="notes-meta"></p>
        </div>
        <div class="filters" id="notes-filters"></div>
        <div class="grid cards-3" id="notes-list"></div>
      </section>

      <section class="block wrap" id="funding">
        <div class="block-head reveal">
          <span class="block-num" aria-hidden="true">06</span>
          <p class="kicker">Grants &amp; Scholarships</p>
          <h2 class="grad">青年補助・獎學金</h2>
          <p class="block-sub" id="funding-meta"></p>
        </div>
        <div class="filters" id="funding-filters"></div>
        <div class="grid cards-3" id="funding-list"></div>
        <h3 class="sub-head" id="opps-head">實驗室頻道看到的機會</h3>
        <div class="grid cards-3" id="opps-list"></div>
      </section>
    </main>

    <footer class="footer wrap">
      <p class="footer-big reveal">Keep reading,<br><em class="grad">keep growing.</em></p>
      <div class="footer-row">
        <p id="footer-links"></p>
        <p id="credits"></p>
      </div>
    </footer>
  </div>

  <script src="data/profile.js?v=17"></script>
  <script src="data/themes.js?v=17"></script>
  <script src="data/brief.js?v=17"></script>
  <script src="data/market.js?v=17"></script>
  <script src="data/papers.js?v=17"></script>
  <script src="data/notes.js?v=17"></script>
  <script src="data/lab.js?v=17"></script>
  <script src="data/stickies.js?v=17"></script>
  <script src="data/funding.js?v=17"></script>
  <!-- 動畫：GSAP + ScrollTrigger（捲動進場）、mo.js（mojs.io 的爆破與幾何動畫）；載入失敗時頁面照常顯示 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mojs/core@1.7.1/dist/mo.umd.js"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
