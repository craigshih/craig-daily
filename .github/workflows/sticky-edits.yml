# 網站上編輯便利貼 → 寫回 Notion → 重新同步並部署網站
# 觸發：網站用你的 GitHub 金鑰把編輯放進 edits/*.json
name: sticky-edits

on:
  push:
    branches: [main]
    paths: ["edits/*.json"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 寫回 Notion 並重新同步
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          pip install --quiet certifi
          python scripts/apply_sticky_edits.py
          python scripts/sync_stickies.py

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A edits data/stickies.js
          git diff --cached --quiet || (git commit -m "套用網站上的便利貼編輯" && git pull --rebase -q && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
