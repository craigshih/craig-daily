# 每日晨報與市場洞察：抓最新文章、產生晨報，並部署 GitHub Pages
# - 主要：每天台灣時間 08:30 由 Mac 的 LaunchAgent（com.craig.dailysite-daily）用 workflow_dispatch 觸發，準時
# - 備援：GitHub 排程常會晚 1–2 小時才跑，所以排程只當作 Mac 沒開機時的保險
# - 中午 12:05、傍晚 18:05 再抓一次市場文章；晨報一天只產生一次（build_brief.py 會略過）
# 平常 push 也會走這裡部署（只部署，不抓文章）
name: daily-market

on:
  schedule: # 使用者偏好尾數 :00 / :05 的時間
    - cron: "35 0 * * *" # 台灣 08:35（備援）
    - cron: "5 4 * * *" # 台灣 12:05
    - cron: "5 10 * * *" # 台灣 18:05
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["edits/**", "vault/**"] # 便利貼編輯由 sticky-edits.yml 處理；vault/ 是加密的行事曆，網站直接讀 GitHub API，不用重新部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: 抓最新文章
        if: github.event_name != 'push'
        env:
          # 選用：在 repo Settings → Secrets 加 GROQ_API_KEY（或 ANTHROPIC_API_KEY），就會有中文重點與今日總覽
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic certifi
          python scripts/fetch_market.py

      - name: 產生每日晨報
        if: github.event_name != 'push'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python scripts/build_brief.py

      - name: 提交更新
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.js data/brief.js
          git diff --cached --quiet || (git commit -m "每日晨報與市場洞察 $(TZ=Asia/Taipei date +%F)" && git pull --rebase -q && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
